name: "renovar_cookies"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovar-cookies
  cancel-in-progress: false

jobs:
  collect:
    name: Renovar Cookies
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Renovação de cookies
        env:
          SPX_USERNAME: ${{ secrets.SPX_USERNAME }}
          SPX_PASSWORD: ${{ secrets.SPX_PASSWORD }}
          GITHUB_PAT: ${{ secrets.PAT_TOKEN }}
          SPX_UK: ${{ secrets.SPX_UK }}
          SPX_UID: ${{ secrets.SPX_UID }}
          SEATALK_WEBHOOK: ${{ secrets.SEATALK_WEBHOOK }}
          COLLECTOR_MODE: "spx"
          EXECUTION_INTERVAL_SECONDS: "60"
        run: timeout 21600 python renovar_cookies.py || true
